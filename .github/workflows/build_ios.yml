name: Build iOS IPA & Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Initialize Platform Folders
        run: |
          flutter create . --org bsi.vn --platforms=ios --project-name=bsms_flutter

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS No-Codesign IPA
        run: |
          # 1. Prepare Xcode Project settings without codesign
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj 2>/dev/null || true
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "";/g' ios/Runner.xcodeproj/project.pbxproj 2>/dev/null || true
          
          # 2. Build Release Archive using xcodebuild
          cd ios
          pod install || true
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -derivedDataPath build_output build
          cd ..

          # 3. Create Payload and Zip IPA
          mkdir -p Payload
          find ios/build_output -name "Runner.app" -type d -exec cp -r {} Payload/ \;
          zip -r BSMS_iOS_Test.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BSMS_iOS_Test.ipa
          path: BSMS_iOS_Test.ipa

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Initialize Platform Folders
        run: |
          flutter create . --org bsi.vn --platforms=android --project-name=bsms_flutter

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BSMS_Android_v2.apk
          path: build/app/outputs/flutter-apk/app-release.apk

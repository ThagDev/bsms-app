name: Build iOS IPA & Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Initialize Platform Folders
        run: |
          flutter create . --org bsi.vn --platforms=ios --project-name=bsms_flutter

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS No-Codesign IPA
        run: |
          # Build Flutter assets & frameworks
          flutter build ios --release --no-codesign --simulator
          
          # Build Native Release App with Xcode without codesign requirement
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
          
          cd ..
          mkdir -p Payload
          APP_PATH=$(find ios/build -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          fi
          cp -r "$APP_PATH" Payload/
          zip -r BSMS_iOS_Test.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BSMS_iOS_Test.ipa
          path: BSMS_iOS_Test.ipa

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Initialize Platform Folders
        run: |
          flutter create . --org bsi.vn --platforms=android --project-name=bsms_flutter

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BSMS_Android_v2.apk
          path: build/app/outputs/flutter-apk/app-release.apk
